# .github/workflows/ci-cd.yml
name: RepLit CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ──────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8 black
          flake8 app/ --max-line-length=100 --exclude=__pycache__
          black app/ --check --line-length=100

      - name: Run tests
        env:
          # Use dummy values for CI; real secrets for deployment
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────
  # JOB 2: Deploy (only on push to main)
  # ──────────────────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /opt/replit-backend
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose ps