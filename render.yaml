# Render blueprint — free-tier deployment of the RepLiT backend.
#
# Usage: push this file, then in Render choose New > Blueprint and point it at
# this repository (branch: safe-commits). Render reads this file, builds the
# Dockerfile at the repo root, and creates the service.
#
# Secrets are deliberately NOT in here. Every value marked `sync: false` must be
# pasted into the Render dashboard once — committing them would put the
# service-role key in git history.
#
# Free-tier limits worth knowing before the demo:
#   - the instance sleeps after ~15 minutes with no traffic, and the next request
#     takes ~50 s to wake it. Open the URL a minute before showing anyone.
#   - while asleep the 60 s neighbourhood scheduler does not run, so crowdsourced
#     alerts pause. Keep a browser tab open during a demo to hold it awake.
#   - 512 MB RAM, no persistent disk. Hence FCM_CREDENTIALS_JSON rather than
#     FCM_CREDENTIALS_FILE: there is nowhere to put the service-account file.

services:
  - type: web
    name: replit-backend
    runtime: docker
    plan: free
    region: singapore # closest Render region to Pasay City
    branch: safe-commits
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO

      # Comma-separated origins of the deployed dashboard. Update once the
      # frontend has its URL, or the browser blocks every request.
      - key: CORS_ORIGINS
        sync: false

      # Must be this service's own public URL. Used to build the email
      # verification links and the Didit KYC callback, so a wrong value sends
      # users to localhost.
      - key: PUBLIC_BASE_URL
        sync: false

      # ---- Supabase (required) ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      # Use the TRANSACTION pooler URI (port 6543) — a free instance holds few
      # connections and the pooler is what keeps that workable.
      - key: DATABASE_URL
        sync: false

      # ---- Optional integrations. Each feature degrades cleanly if unset, so a
      # demo can go live before every provider is configured. ----
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      # The whole service-account JSON on one line — there is no writable disk.
      - key: FCM_CREDENTIALS_JSON
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
