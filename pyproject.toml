[project]
name = "replit-backend"
version = "0.1.0"
description = "RepLiT — Pasay City Fire Volunteer Coordination Platform (FastAPI backend)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "pyjwt[crypto]>=2.8.0",
    "twilio>=9.0.0",
    "email-validator>=2.1.0",
    "tenacity>=8.3.0",
    "aiosmtplib>=3.0.0",
    "python-multipart>=0.0.32",
    "firebase-admin>=7.4.0",
    "exifread>=3.5.1",
    "pillow>=12.2.0",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.uv]
# Application, not a library: manage dependencies only, don't build/install the project.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type stubs.
module = ["structlog.*", "twilio.*", "asyncpg.*", "firebase_admin.*", "exifread.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    # Starlette 1.x deprecation steering its TestClient toward a future httpx —
    # harmless for our tests. Suppress for clean output; revisit in Phase 16/17.
    "ignore:Using .httpx. with .starlette.testclient.:Warning",
]
